server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Images, CSS and JS change rarely; let browsers cache them for a week.
    location ~* \.(?:jpe?g|png|gif|svg|webp|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
