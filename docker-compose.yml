# Antioch Church static site (antiochchurch.ca). Serves ./antiochchurch
# read-only, so `git pull` here updates the live site.
# Host nginx terminates TLS and proxies to 127.0.0.1:8100.
services:
  web:
    image: nginx:1.27-alpine
    container_name: antiochchurch-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:80"
    volumes:
      - "./antiochchurch:/usr/share/nginx/html:ro"
      - ./site.conf:/etc/nginx/conf.d/default.conf:ro
